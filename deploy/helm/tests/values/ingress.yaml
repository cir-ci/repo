# No hosted sites: an Ingress, a Secret of your own, a CA from a ConfigMap of your own.
public_url: https://ci.acme.io
ingress:
  enabled: true
  className: alb
  annotations: { alb.ingress.kubernetes.io/scheme: internet-facing }
  tls: [{ secretName: circi-tls, hosts: [ci.acme.io] }]
networkPolicy:
  enabled: true
  ingressNamespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
s3: { bucket: acme-circi }
all: { replicas: 2 }
existing_secret: circi-secrets
existing_secret_keys: [SMTP_PASSWORD]
smtp: { host: smtp.example.com, user: mailer, from: ci@acme.io }
database:
  existing_ca_config_map: rds-ca
