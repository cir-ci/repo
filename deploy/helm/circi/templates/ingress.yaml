{{- if .Values.ingress.enabled }}
{{- $host := (urlParse (include "circi.publicUrl" .)).hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "circi.fullname" . }}
  labels:
    {{- include "circi.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range concat (list $host) .Values.ingress.hosts | uniq }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "circi.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
