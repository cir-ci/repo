{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "circi.serviceAccountName" . }}
  labels:
    {{- include "circi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.caddy.enabled .Values.caddy.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "circi.caddyServiceAccountName" . }}
  labels:
    {{- include "circi.labels" . | nindent 4 }}
    circi.dev/workload: caddy
  {{- with .Values.caddy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
