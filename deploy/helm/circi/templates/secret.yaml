{{- if not .Values.existing_secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "circi.fullname" . }}
  labels:
    {{- include "circi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := include "circi.secrets" . | fromYaml }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
