# Overlay: S3-compatible storage through a local MinIO, for development and for running the
# live S3 tests. For production, point S3_* at AWS S3, Cloudflare R2, Backblaze B2 or similar
# instead of running MinIO (MinIO no longer publishes maintained community images).
#
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build
#   ZOPHEROS_TEST_S3_ENDPOINT=http://localhost:9000 pnpm test   # from the repo root

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-zopheros}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-zopheros-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/zopheros
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-zopheros}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-zopheros-dev-secret}

  zopheros:
    environment:
      STORAGE_DRIVER: s3
      S3_BUCKET: zopheros
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-zopheros}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-zopheros-dev-secret}
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  miniodata:
