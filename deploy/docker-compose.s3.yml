# Overlay: S3-compatible storage through a local SeaweedFS, for development and for running the
# live S3 tests. For production, point S3_* at AWS S3, Cloudflare R2, Backblaze B2 or similar
# instead of running this (any S3-compatible service works, MinIO included).
#
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build
#   CIRCI_TEST_S3_ENDPOINT=http://localhost:9000 pnpm test   # from the repo root

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    # One process: master, volume server, filer and the S3 gateway on 9000.
    command: ['server', '-dir=/data', '-s3', '-s3.port=9000']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-circi}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-circi-dev-secret}
    ports:
      - '${S3_PORT:-9000}:9000'
    volumes:
      - s3data:/data
    healthcheck:
      # 127.0.0.1, not localhost: the gateway listens on IPv4 only.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000']
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.40.3
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        aws --endpoint-url http://seaweedfs:9000 s3api head-bucket --bucket circi 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:9000 s3api create-bucket --bucket circi
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-circi}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-circi-dev-secret}
      AWS_DEFAULT_REGION: us-east-1

  circi:
    environment:
      STORAGE_DRIVER: s3
      S3_BUCKET: circi
      S3_REGION: us-east-1
      S3_ENDPOINT: http://seaweedfs:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-circi}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-circi-dev-secret}
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  s3data:
