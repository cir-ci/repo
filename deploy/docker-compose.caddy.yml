# TLS for the dashboard and the sites domain, with Caddy.
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
# Needs DASHBOARD_HOST and SITES_HOST in .env, and AWS credentials for Route53 (an instance role
# works without any variables). Read https://circi.dev/self-hosting/site-domains/ first, including the domain warning.
services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:?set DASHBOARD_HOST}
      SITES_HOST: ${SITES_HOST:?set SITES_HOST}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    networks:
      default:
        # The one proxy the app trusts (TRUSTED_PROXIES below).
        ipv4_address: ${CADDY_ADDRESS:-192.168.250.10}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - circi

  circi:
    environment:
      PUBLIC_URL: https://${DASHBOARD_HOST}
      # Believe the client address Caddy forwards, and no one else's.
      TRUSTED_PROXIES: ${CADDY_ADDRESS:-192.168.250.10}
      STATIC_SITES_HOST: ${SITES_HOST}

# A fixed subnet, so Caddy's address is known. It must not overlap a network the host reaches (an AWS
# default VPC is 172.31.0.0/16); change both CIRCI_SUBNET and CADDY_ADDRESS (an address in it) if it does.
networks:
  default:
    ipam:
      config:
        - subnet: ${CIRCI_SUBNET:-192.168.250.0/24}

volumes:
  caddy-data:
  caddy-config:
