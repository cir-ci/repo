# CirCI: single-server install with local-disk storage (the cheapest setup, PLAN §2).
#
#   cd deploy && cp .env.example .env   # set POSTGRES_PASSWORD and PUBLIC_URL
#   docker compose up -d --build
#   docker compose exec circi circi admin workspace create --name "Acme"
#   docker compose exec circi circi admin project create --org acme --name "Web app"
#
# For S3-compatible storage (local MinIO for development), add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build

name: circi

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: circi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: circi
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U circi -d circi']
      interval: 5s
      timeout: 3s
      retries: 20

  circi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: circi:local
    restart: unless-stopped
    command: ['all']
    environment:
      DATABASE_URL: postgres://circi:${POSTGRES_PASSWORD}@postgres:5432/circi
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PREVIOUS_PUBLIC_URLS: ${PREVIOUS_PUBLIC_URLS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env (openssl rand -base64 32)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The SMTP_*, AUTH_*, WORKSPACE_CREATION, STATIC_SITES_MAX_MB, UPLOAD_TIMEOUT_MINUTES, GC_GRACE_HOURS,
      # JOB_RETENTION_DAYS, WEBHOOK_TIMEOUT_SECONDS and SLACK_* variables are optional: a variable that is set
      # wins and locks the setting in Instance > Settings; leave it empty to manage it in the dashboard.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-}
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-}
      AUTH_SSO_ENABLED: ${AUTH_SSO_ENABLED:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
      AUTH_OIDC_TRUSTED_FOR_EMAIL: ${AUTH_OIDC_TRUSTED_FOR_EMAIL:-}
      WEBHOOK_ALLOW_PRIVATE_ADDRESSES: ${WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-}
      WORKSPACE_CREATION: ${WORKSPACE_CREATION:-}
      STATIC_SITES_HOST: ${STATIC_SITES_HOST:-}
      STATIC_SITES_MAX_MB: ${STATIC_SITES_MAX_MB:-}
      UPLOAD_TIMEOUT_MINUTES: ${UPLOAD_TIMEOUT_MINUTES:-}
      GC_GRACE_HOURS: ${GC_GRACE_HOURS:-}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-}
      CIRCI_DIFF_ENGINE: ${CIRCI_DIFF_ENGINE:-}
      STORAGE_DRIVER: fs
      STORAGE_PATH: /var/lib/circi/files
    ports:
      - '${CIRCI_PORT:-3000}:3000'
    volumes:
      - files:/var/lib/circi/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  files:
