# CirCI: single-server install with local-disk storage (the cheapest setup, PLAN §2).
#
#   cd deploy && cp .env.example .env   # set POSTGRES_PASSWORD and PUBLIC_URL
#   docker compose up -d --build
#   docker compose exec circi circi admin workspace create --name "Acme"
#   docker compose exec circi circi admin project create --org acme --name "Web app"
#
# For S3-compatible storage (a local SeaweedFS for development), add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build

name: circi

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: circi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: circi
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U circi -d circi']
      interval: 5s
      timeout: 3s
      retries: 20

  circi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: circi:local
    restart: unless-stopped
    command: ['all']
    environment:
      # Every setting the server reads, from deploy/.env (packages/config/test/deploy-settings.test.ts
      # fails when one is missing). Empty means unset: the server's default applies, and the settings of
      # Instance > Settings (SMTP_*, AUTH_*_ENABLED, WORKSPACE_CREATION, SLACK_*, STATIC_SITES_MAX_MB,
      # UPLOAD_TIMEOUT_MINUTES, GC_GRACE_HOURS, JOB_RETENTION_DAYS, WEBHOOK_TIMEOUT_SECONDS) stay
      # changeable in the dashboard; one that is set wins and locks it there.
      DATABASE_URL: postgres://circi:${POSTGRES_PASSWORD}@postgres:5432/circi
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PREVIOUS_PUBLIC_URLS: ${PREVIOUS_PUBLIC_URLS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env (openssl rand -base64 32)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Screenshots on the files volume, or in S3 (STORAGE_DRIVER=s3 and S3_*).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_PATH: /var/lib/circi/files
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-}
      S3_REQUEST_TIMEOUT_SECONDS: ${S3_REQUEST_TIMEOUT_SECONDS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-}
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-}
      AUTH_SSO_ENABLED: ${AUTH_SSO_ENABLED:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GITLAB_CLIENT_ID: ${AUTH_GITLAB_CLIENT_ID:-}
      AUTH_GITLAB_CLIENT_SECRET: ${AUTH_GITLAB_CLIENT_SECRET:-}
      AUTH_GITLAB_URL: ${AUTH_GITLAB_URL:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
      AUTH_OIDC_TRUSTED_FOR_EMAIL: ${AUTH_OIDC_TRUSTED_FOR_EMAIL:-}
      WORKSPACE_CREATION: ${WORKSPACE_CREATION:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_API_TIMEOUT_SECONDS: ${GITHUB_API_TIMEOUT_SECONDS:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_API_URL: ${SLACK_API_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      STATIC_SITES_HOST: ${STATIC_SITES_HOST:-}
      STATIC_SITES_MAX_MB: ${STATIC_SITES_MAX_MB:-}
      UPLOAD_TIMEOUT_MINUTES: ${UPLOAD_TIMEOUT_MINUTES:-}
      GC_GRACE_HOURS: ${GC_GRACE_HOURS:-}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-}
      WEBHOOK_ALLOW_PRIVATE_ADDRESSES: ${WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-}
      LIVE_MAX_STREAMS: ${LIVE_MAX_STREAMS:-}
      CIRCI_DIFF_ENGINE: ${CIRCI_DIFF_ENGINE:-}
      CIRCI_DIFF_THREADS: ${CIRCI_DIFF_THREADS:-}
    ports:
      - '${CIRCI_PORT:-3000}:3000'
    volumes:
      - files:/var/lib/circi/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  files:
