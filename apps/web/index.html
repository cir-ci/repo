<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/src/features/auth/logo.svg" />
    <!-- The installed app: its manifest, icon and title-bar colour (the chrome token, per scheme). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/180.png" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9e2de" media="(prefers-color-scheme: light)" />
    <title>CirCI</title>
    <!-- The loading screen's layout, before any script: a stylesheet link applies before the first paint. -->
    <link rel="stylesheet" href="/src/boot.css" />
    <script>
      // Pick the colour scheme before the first paint (keys match @circi/ui's theme.ts).
      try {
        const m = localStorage.getItem('circi-color-mode')
        const s =
          m === 'light' || m === 'dark'
            ? m
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-circi-color-scheme', s)
      } catch {}
    </script>
  </head>
  <body>
    <!-- The loading screen (styles in src/boot.css): above the app until the app's own logo has
         been drawn in the same place, then removed (lib/boot-screen.ts), so nothing flashes. -->
    <div id="circi-boot" class="circi-boot" aria-busy="true">
      <img src="/src/features/auth/logo.svg" alt="CirCI" width="56" height="56" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
