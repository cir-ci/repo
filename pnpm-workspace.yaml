packages:
  - apps/*
  - packages/*
  - e2e
  - dev
  - perf
allowBuilds:
  esbuild: true
  # Not run at install (it would download the Cypress binary, ~200 MB, for everyone): the Cypress test and CI run `cypress install`.
  cypress: false
minimumReleaseAgeExclude:
  - tsdown
  - '@tsdown/*'
# Every dependency's version lives here, the workspace's own packages too (`workspace:*`): `pnpm add`
# writes `catalog:` (strict), and packages/services/test/catalog.test.ts fails on anything else.
catalogMode: strict
catalog:
  '@arethetypeswrong/core': 0.18.5
  '@aws-sdk/client-s3': 3.1171.0
  '@aws-sdk/s3-request-presigner': 3.1171.0
