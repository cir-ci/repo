# The services `pnpm dev` needs besides CirCI itself, which runs from source on the host.
# Started and stopped by dev/src/main.ts (project `circi-dev`); data persists in named volumes
# until `pnpm dev:reset`. Ports bind to 127.0.0.1 only; override them with the variables below.

name: circi-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: circi
      POSTGRES_PASSWORD: circi
      POSTGRES_DB: circi
    ports:
      - '127.0.0.1:${CIRCI_DEV_POSTGRES_PORT:-54329}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U circi -d circi']
      interval: 1s
      timeout: 3s
      retries: 60

  # Catches every mail the server sends (sign-in codes, invitations): web UI on 8025.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${CIRCI_DEV_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${CIRCI_DEV_MAIL_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
