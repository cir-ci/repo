name: Bug report
description: Something in CirCI doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the [issues](https://github.com/cir-ci/repo/issues) and [discussions](https://github.com/cir-ci/repo/discussions), closed ones too, before you file. If a report matches yours, add a reaction instead of a comment.

        Security problems go through the repository's Security tab ("Report a vulnerability"), never here. Remove tokens, passwords and secrets from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, a command or a minimal repository. Without a way to reproduce it, a bug is hard to fix.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CirCI version
      description: The image tag, the commit or `circi --version`.
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How you run CirCI
      options:
        - Docker Compose (deploy/)
        - Another container setup
        - From source (pnpm circi / pnpm dev)
        - The CLI or the Vitest plugin only
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Storage (local disk or S3), Postgres version, reverse proxy, browser and OS for dashboard bugs, the CI system for upload bugs.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Server or worker logs, CLI output (add `--debug`), or a screenshot of the dashboard. Trim them to the relevant part.
      render: shell
  - type: checkboxes
    id: ai
    attributes:
      label: AI assistance
      options:
        - label: I used no AI tool to write this report, or I reviewed and edited what it wrote and say which tool below.
          required: true
  - type: input
    id: ai-tool
    attributes:
      label: AI tool, if you used one
