name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker-smoke:
    name: Docker image + compose smoke test
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy
    env:
      POSTGRES_PASSWORD: ci-only-password
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.s3.yml
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack (Postgres + MinIO + CirCI)
        run: $COMPOSE up -d --build --wait --wait-timeout 180
      - name: Ready and healthy
        run: curl -fsS http://localhost:3000/readyz
      - name: Admin commands work inside the image
        run: |
          $COMPOSE exec -T circi circi admin org create --name "CI Org"
          $COMPOSE exec -T circi circi admin project create --org ci-org --name "Web" --json \
            | grep -q '"token": "circi_'
          $COMPOSE exec -T circi circi admin project list --org ci-org
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Live S3 storage tests against MinIO
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          CIRCI_TEST_S3_ENDPOINT=http://localhost:9000 pnpm exec vitest run packages/storage
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
