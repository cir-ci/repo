name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker-smoke:
    name: Docker image + compose smoke test
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy
    env:
      POSTGRES_PASSWORD: ci-only-password
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.s3.yml
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack (Postgres + MinIO + CirCI)
        run: $COMPOSE up -d --build --wait --wait-timeout 180
      - name: Ready and healthy
        run: curl -fsS http://localhost:3000/readyz
      - name: Admin commands work inside the image
        run: |
          $COMPOSE exec -T circi circi admin user create --email ci@example.com --name CI \
            --password ci-only-password-123
          $COMPOSE exec -T circi circi admin workspace create --name "CI Workspace" --owner ci@example.com
          $COMPOSE exec -T circi circi admin team create --org ci-workspace --name "Web" --json \
            | grep -q '"token": "circi_'
          $COMPOSE exec -T circi circi admin team list --org ci-workspace
      - name: Sign-in works, and the dashboard API needs it
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/teams)" = 401
          curl -fsS -c cookies.txt -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"email":"ci@example.com","password":"ci-only-password-123"}' \
            http://localhost:3000/api/auth/sign-in/email
          curl -fsS -b cookies.txt http://localhost:3000/api/teams | grep -q '"ci-workspace"'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Live S3 storage tests against MinIO
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          CIRCI_TEST_S3_ENDPOINT=http://localhost:9000 pnpm exec vitest run packages/storage
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
