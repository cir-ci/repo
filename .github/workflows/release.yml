# Releases run on GitHub Actions, not CircleCI: npm provenance needs GitHub's OIDC identity token
# (`id-token: write`), which CircleCI can't issue. Everything else (the gate, the end-to-end tests) stays on
# CircleCI; see .circleci/config.yml.
#
# On every push to main, changesets/action either opens or updates the "Version Packages" pull request (when
# unreleased changesets exist) or, when that pull request has just been merged, publishes @circi/cli and
# @circi/vitest to npm. The repo ruleset requires pull requests into main, so the action only ever pushes the
# `changeset-release/main` branch and opens a pull request; merging it is the release.
#
# The app is released the same way: its version is @circi/server's (Changesets versions it like the npm packages), and
# the `image` job publishes ghcr.io/<owner>/circi:<version> and circi-caddy:<version> the first time a version is on main.
# deploy/terraform runs a given version (circi_version); the `terraform-mirror` job copies the module to its registry repository.
#
# Needs: the NPM_TOKEN Actions secret, and Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the changeset-release/main branch and tags, create releases
  pull-requests: write # open and update the Version Packages pull request
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6 # reads the pnpm version from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # devEngines.runtime
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # v2: v1 read what was published from the CLI's output, which Changesets v3 changed, so it skipped the
      # tags and GitHub releases. v2 reads the file CHANGESETS_OUTPUT names, which `pnpm release` passes down.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # what setup-node's registry-url .npmrc reads
          NPM_CONFIG_PROVENANCE: 'true'

  # The app's images, once per version: ghcr.io/<owner>/circi:<version> (also :<major>.<minor> and :latest) and the
  # matching Caddy image. A push whose version already has an image (any merge that isn't a release) does nothing.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/circi
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.0.0 has never been released; an existing tag is never rebuilt, so a version always means one image.
          if [ "$version" = 0.0.0 ] || docker manifest inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.version.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=circi
          cache-to: type=gha,scope=circi,mode=max
      - if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-caddy:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  # The Terraform module on the Terraform Registry (cir-ci/circi/docker): the registry needs a repository of its own with
  # the module at its root and `vX.Y.Z` tags, so each app version is mirrored to cir-ci/terraform-docker-circi after its
  # image is up (scripts/sync-terraform-mirror.sh; a version already tagged there is skipped). Pushes over SSH
  # with the TERRAFORM_MIRROR_DEPLOY_KEY secret, the private key of a deploy key with write access on the mirror; without
  # it the job only says so.
  terraform-mirror:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The private half of a deploy key with write access on the mirror (cir-ci/terraform-docker-circi): it can
      # push to that one repository and nothing else, and isn't tied to anyone's account.
      MIRROR_DEPLOY_KEY: ${{ secrets.TERRAFORM_MIRROR_DEPLOY_KEY }}
    steps:
      - if: env.MIRROR_DEPLOY_KEY == ''
        run: echo "::notice::TERRAFORM_MIRROR_DEPLOY_KEY is not set, so the Terraform module was not mirrored to the registry's repository."
      - if: env.MIRROR_DEPLOY_KEY != ''
        uses: actions/checkout@v7
      - if: env.MIRROR_DEPLOY_KEY != ''
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          if [ "$version" = 0.0.0 ]; then
            echo "Version 0.0.0 has never been released; nothing to mirror."
            exit 0
          fi
          # The key in a file only this job reads, and github.com's host keys from GitHub's own API, so ssh
          # refuses any other host.
          ssh_dir=$(mktemp -d)
          install -m 600 /dev/null "$ssh_dir/key"
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$ssh_dir/key"
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          scripts/sync-terraform-mirror.sh "$version" "git@github.com:${GITHUB_REPOSITORY_OWNER}/terraform-docker-circi.git"
