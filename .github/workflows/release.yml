# Releases run on GitHub Actions, not CircleCI: npm provenance needs GitHub's OIDC identity token
# (`id-token: write`), which CircleCI can't issue. Everything else (the gate, the end-to-end tests) stays on
# CircleCI; see .circleci/config.yml.
#
# On every push to main, changesets/action either opens or updates the "Version Packages" pull request (when
# unreleased changesets exist) or, when that pull request has just been merged, publishes @circi/cli and
# @circi/vitest to npm. The repo ruleset requires pull requests into main, so the action only ever pushes the
# `changeset-release/main` branch and opens a pull request; merging it is the release.
#
# The app is released the same way: its version is @circi/server's (Changesets versions it like the npm packages), and
# the `image` job publishes ghcr.io/<owner>/circi:<version> and circi-caddy:<version> the first time a version is on main.
# deploy/terraform runs a given version (circi_version); the `terraform-mirror` job copies the module to its registry repository.
# The `helm-chart` job publishes deploy/helm/circi as oci://ghcr.io/<owner>/charts/circi:<version> next to the image.
# The `docs` job asks cir-ci/documentation to rebuild circi.dev after a release, so its changelog is current.
#
# Everything this workflow writes to GitHub (the Version Packages pull request and its commit, tags, GitHub releases, the
# circi.dev rebuild, the Terraform mirror's commit) is done as the organization's `cir-ci` GitHub App, cir-ci[bot], not as
# github-actions[bot]: a token from its client ID (the CIRCI_APP_CLIENT_ID variable) and private key (the
# CIRCI_APP_PRIVATE_KEY secret). The app is installed on the organization's repositories with Contents and Pull requests:
# write. A pull request the app opens also starts the other workflows, which one opened with GITHUB_TOKEN doesn't.
# Images and the chart still go to ghcr.io with the job's GITHUB_TOKEN (packages: write), which an app token can't do.
#
# Needs: the NPM_TOKEN Actions secret, and the CIRCI_APP_CLIENT_ID variable and CIRCI_APP_PRIVATE_KEY secret.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/circi

permissions:
  contents: write # push the changeset-release/main branch and tags, create releases
  pull-requests: write # open and update the Version Packages pull request
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6 # reads the pnpm version from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # devEngines.runtime
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The app's token, so the pull request, its commit, the tags and the releases are cir-ci[bot]'s (see the top).
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CIRCI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIRCI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # v2: v1 read what was published from the CLI's output, which Changesets v3 changed, so it skipped the
      # tags and GitHub releases. v2 reads the file CHANGESETS_OUTPUT names, which `pnpm release` passes down.
      # It commits through the GitHub API (not git), so the commit's author is the token's: cir-ci[bot].
      - id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.token.outputs.token }}
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # what setup-node's registry-url .npmrc reads
          NPM_CONFIG_PROVENANCE: 'true'

  # The app's images, once per version: ghcr.io/<owner>/circi:<version> (also :<major>.<minor> and :latest) and the
  # matching Caddy image, each for linux/amd64 and linux/arm64. `image-version` decides the mode: `build` when the
  # version has no tag, `retag` when it has one but :latest isn't it (a run that failed between the tags; a version is
  # never rebuilt), `none` otherwise (any merge that isn't a release). `image-build` builds and starts each platform on
  # a native runner (no QEMU: the Rust diff and the pnpm install would take many times longer emulated) and pushes it
  # by digest; `image` tags: the Caddy version, the app version, then :<major>.<minor> and :latest. A failed build's
  # digests are kept 7 days; after that, rerun with "Re-run all jobs".
  image-version:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}
    permissions:
      contents: read
      packages: read # read the tags on ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2> /dev/null; }
          # 0.0.0 has never been released. main always holds the newest version, so :latest must be its image.
          if [ "$version" = 0.0.0 ]; then
            mode=none
          elif ! tagged=$(digest "$IMAGE:$version"); then
            mode=build
          elif [ "$(digest "$IMAGE:latest")" != "$tagged" ]; then
            mode=retag
          else
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  image-build:
    needs: image-version
    if: needs.image-version.outputs.mode == 'build'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            pair: linux-arm64
            runner: ubuntu-24.04-arm # GitHub's arm64 runner, free for public repositories
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
    env:
      VERSION: ${{ needs.image-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: caddy
        uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }}-caddy,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=caddy-${{ matrix.pair }}
          cache-to: type=gha,scope=caddy-${{ matrix.pair }},mode=max
      # The OCI labels (source, revision, and the version: the tag is never pushed, the build pushes by digest).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}
      - id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=circi-${{ matrix.pair }}
          cache-to: type=gha,scope=circi-${{ matrix.pair }},mode=max
      # CI runs the image on amd64 only: start this platform's once, so a broken native binary (sharp, the Rust diff)
      # fails here, before its digest can be tagged.
      - run: |
          ref="$IMAGE@$DIGEST"
          test "$(docker run --rm "$ref" --version)" = "$VERSION"
          docker run --rm --entrypoint node "$ref" -e "
            process.dlopen({ exports: {} }, '/app/dist/circi-diff.node')
            require('sharp')({ create: { width: 1, height: 1, channels: 4, background: '#000' } }).png().toBuffer()
              .then(() => console.log('circi, sharp and the native diff load on ' + process.arch))"
        env:
          DIGEST: ${{ steps.app.outputs.digest }}
      # One empty file per digest, named by it; the `image` job reads the names back.
      - run: |
          mkdir -p digests/app digests/caddy
          touch "digests/app/${APP#sha256:}" "digests/caddy/${CADDY#sha256:}"
        env:
          APP: ${{ steps.app.outputs.digest }}
          CADDY: ${{ steps.caddy.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: digests
          if-no-files-found: error
          retention-days: 7

  # Runs whenever `image-version` has and `image-build` didn't fail, so the jobs below always get the version and mode.
  image:
    needs: [image-version, image-build]
    if: ${{ !cancelled() && needs.image-version.result == 'success' && needs.image-build.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.image-version.outputs.version }}
      mode: ${{ needs.image-version.outputs.mode }}
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
    env:
      VERSION: ${{ needs.image-version.outputs.version }}
      MODE: ${{ needs.image-version.outputs.mode }}
    steps:
      - if: env.MODE == 'build'
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - if: env.MODE != 'none'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.MODE != 'none'
        uses: docker/setup-buildx-action@v4
      # The annotations go on the multi-platform index, which is what ghcr.io reads the description and source from.
      - if: env.MODE != 'none'
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
      - if: env.MODE != 'none'
        run: |
          shopt -s nullglob
          if [ "$MODE" = build ]; then
            app=() caddy=() annotations=()
            for f in digests/app/*; do app+=("$IMAGE@sha256:$(basename "$f")"); done
            for f in digests/caddy/*; do caddy+=("$IMAGE-caddy@sha256:$(basename "$f")"); done
            if [ "${#app[@]}" -ne 2 ] || [ "${#caddy[@]}" -ne 2 ]; then
              echo "Expected one digest per platform (2) of each image, got ${#app[@]} and ${#caddy[@]}."
              echo "The digests are kept 7 days; after that, rebuild with \"Re-run all jobs\"."
              exit 1
            fi
            while read -r a; do annotations+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            docker buildx imagetools create -t "$IMAGE-caddy:$VERSION" "${caddy[@]}"
            docker buildx imagetools create "${annotations[@]}" -t "$IMAGE:$VERSION" "${app[@]}"
          fi
          # Copies the version's index as it is, so :latest has its digest (what `image-version` compares).
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"

  # The Helm chart (deploy/helm/circi) as an OCI chart, once per version, when the image job has just published that
  # version (or only moved :latest to it, after a failed run): the chart runs that image (its appVersion is the app's
  # version, which `pnpm version-packages` keeps in step), so a version never has a chart without an image. Needs no secret beyond the job's GITHUB_TOKEN.
  helm-chart:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.image.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
    env:
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm package deploy/helm/circi --destination chart
      - run: helm push "chart/circi-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # The Terraform module on the Terraform Registry (cir-ci/circi/docker), which needs a repository of its own with the
  # module at its root and `vX.Y.Z` tags: each app version is copied to cir-ci/terraform-docker-circi once its image is
  # up (the module runs that image). A version already tagged there is skipped, so a rerun repairs a failed push.
  # Pushes with a deploy key of the mirror (TERRAFORM_MIRROR_DEPLOY_KEY); without it the job only says so.
  terraform-mirror:
    needs: image
    # A skipped `image-build` (any push that isn't a release) fails the implicit success(), as for helm-chart and docs.
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.image.outputs.version != '0.0.0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - id: key
        run: |
          if [ "${{ secrets.TERRAFORM_MIRROR_DEPLOY_KEY != '' }}" = true ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TERRAFORM_MIRROR_DEPLOY_KEY is not set, so the Terraform module was not mirrored."
          fi
      # Asks the mirror (public, so no key) whether this version is there, whatever its newest commit is.
      - if: steps.key.outputs.set
        id: tag
        run: |
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository_owner }}/terraform-docker-circi.git" "refs/tags/v$VERSION" > /dev/null; then
            echo "The mirror already has v$VERSION."
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      # The module as it was released, from the release's tag, not as it is on this commit of main.
      - if: steps.tag.outputs.missing
        uses: actions/checkout@v7
        with:
          ref: refs/tags/@circi/server@${{ env.VERSION }}
          persist-credentials: false
      - if: steps.tag.outputs.missing
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/terraform-docker-circi
          ssh-key: ${{ secrets.TERRAFORM_MIRROR_DEPLOY_KEY }}
          path: mirror
      - if: steps.tag.outputs.missing
        working-directory: mirror
        run: |
          # Every file of the module; the registry page's README instead of the module's own (which is about the code);
          # the Caddyfile the module runs (deploy/Caddyfile, which the module reads from ../ in this repository); and
          # the license.
          rsync -a --delete --exclude=/.git --exclude=/README.md --exclude=/Caddyfile --exclude=/LICENSE ../deploy/terraform/ ./
          cp ../deploy/terraform-mirror/README.md README.md
          cp ../deploy/Caddyfile Caddyfile
          cp ../LICENSE LICENSE
          git add -A
          # Committed as cir-ci[bot], the app that does the rest of the release (its noreply address is its user ID).
          git -c user.name='cir-ci[bot]' -c user.email='352933691+cir-ci[bot]@users.noreply.github.com' \
            commit --quiet --allow-empty -m "CirCI $VERSION" -m "Generated from ${{ github.repository }}, release @circi/server@$VERSION."
          git tag "v$VERSION"
          git push --quiet --atomic origin HEAD:main "v$VERSION"

  # circi.dev (cir-ci/documentation) builds its changelog from this repository's CHANGELOG.md files: after a release
  # (npm packages published, or a new app version), send it a `circi-release` event, which its Pages workflow deploys on.
  # A workflow's own GITHUB_TOKEN can't reach another repository, so the token comes from the organization's `cir-ci`
  # GitHub App, installed on cir-ci/documentation with Contents: write: its client ID is the CIRCI_APP_CLIENT_ID
  # variable, its private key the CIRCI_APP_PRIVATE_KEY secret.
  docs:
    needs: [release, image]
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || (needs.image.result == 'success' && needs.image.outputs.mode != 'none')) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CIRCI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIRCI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: documentation
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository_owner }}/documentation/dispatches" \
            -f event_type=circi-release -f "client_payload[sha]=${{ github.sha }}"
