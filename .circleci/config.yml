# CirCI's CI. Two workflows:
#
#   gate  every push and pull request: `pnpm gate` (format check, lint, typecheck, the Node, UI and web
#         browser tests, build). No Docker. Required status check: `gate`.
#         The `changeset` job (branches other than main) fails when a published package changed without a
#         changeset. The `terraform` job checks and tests deploy/terraform (`terraform test`, a mocked
#         Docker provider: no Docker); the `helm` job lints deploy/helm/circi and checks its renders
#         with kubeconform (`pnpm test:helm`, no cluster).
#   e2e   pushes to main and the nightly pipeline: the end-to-end tests against the real Docker stack
#         (`e2e`) and the shipped Compose files (`compose-smoke`). Machine executor, so Docker works.
#   renovate  the scheduled pipeline with `renovate` = true: Renovate opens and updates the dependency
#         pull requests (.github/renovate.json). Self-hosted here, not the hosted app, because its
#         post-upgrade task (scripts/renovate-changeset.mjs, the changeset) must be allowed by
#         Renovate's own configuration. It signs in as the organization's `cir-ci` GitHub App.
#
# The nightly run is a scheduled pipeline that sets the `nightly` parameter to true. Scheduled pipelines
# are created in the CircleCI UI (Project Settings > Triggers > Add Trigger), not in this file: pick the
# branch (main), a time, and add the pipeline parameter `nightly` = true. See CONTRIBUTING.md.
# Renovate's is another such trigger, hourly on main, with `renovate` = true (the schedule in
# .github/renovate.json decides when it opens pull requests; the other runs rebase and answer the
# dependency dashboard).
version: 2.1

orbs:
  node: circleci/node@7.2.1
  terraform: circleci/terraform@3.7.0

parameters:
  nightly:
    type: boolean
    default: false
  renovate:
    type: boolean
    default: false

executors:
  node:
    parameters:
      variant:
        description: An image variant suffix, e.g. -browsers
        type: string
        default: ''
    docker:
      # Its Node only starts pnpm (see `setup`). The gate takes the -browsers variant, which has
      # Chromium's system libraries, so it needs no apt-get: an Ubuntu mirror outage failed it before
      # any test ran.
      - image: cimg/node:26.13<< parameters.variant >>
    resource_class: large # 4 vCPU, 8 GB: the two browser test projects each take a quarter of the cores
    working_directory: ~/circi
    environment:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
  docker-vm:
    machine:
      image: ubuntu-2404:current
    resource_class: large # 4 vCPU, 15 GB: the end-to-end stack needs the Docker VM's memory
    working_directory: ~/circi
    environment:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
commands:
  # pnpm 12.22.0 (package.json's "packageManager") on the executor's own Node, then `pnpm install
  # --frozen-lockfile` with the orb's node_modules cache. The install also installs package.json's
  # devEngines.runtime (the Node 26 pinned in the lockfile), and every pnpm script and `pnpm exec`
  # runs on that one, so the executor's Node only has to start pnpm.
  setup:
    steps:
      - node/install-pnpm:
          version: '12.22.0'
      - node/install-packages:
          pkg-manager: pnpm

  # Turborepo's cache (.turbo/cache) makes an unchanged task instant. The key is per revision, so every
  # run saves; the restore falls back to the branch's latest, then to any run.
  restore-turbo:
    steps:
      # The release PR's branch is cut again from main for every release, so its own last cache is from
      # an older main (the previous release) and matches nothing: it takes main's.
      - when:
          condition:
            matches:
              pattern: '^(changesets-ghcommit-temp/)?changeset-release/main$'
              value: << pipeline.git.branch >>
          steps:
            - restore_cache:
                keys:
                  - turbo-v1-{{ arch }}-main-
                  - turbo-v1-{{ arch }}-
      - unless:
          condition:
            matches:
              pattern: '^(changesets-ghcommit-temp/)?changeset-release/main$'
              value: << pipeline.git.branch >>
          steps:
            - restore_cache:
                # This branch's last cache, else main's: a new pull request branch starts from main, so main's
                # cache replays every task its changes don't touch. Any branch's cache comes last: one cut from
                # an older main matches little and reran the whole gate.
                keys:
                  - turbo-v1-{{ arch }}-{{ .Branch }}-{{ .Revision }}
                  - turbo-v1-{{ arch }}-{{ .Branch }}-
                  - turbo-v1-{{ arch }}-main-
                  - turbo-v1-{{ arch }}-

  save-turbo:
    steps:
      - save_cache:
          key: turbo-v1-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .turbo
          when: always

  install-chromium:
    parameters:
      with-deps:
        type: boolean
        default: true
    steps:
      - restore_cache:
          keys:
            - playwright-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Chromium for Playwright
          command: |
            if [ "<< parameters.with-deps >>" = "true" ]; then
              pnpm exec playwright install --with-deps chromium
            else
              pnpm exec playwright install chromium
            fi
      - save_cache:
          key: playwright-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright

  # The Cypress binary (about 200 MB) isn't downloaded by the install (pnpm-workspace.yaml's
  # allowBuilds); @circi/cypress's integration test runs real Cypress in Electron.
  install-cypress:
    steps:
      - restore_cache:
          keys:
            - cypress-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install the Cypress binary
          command: pnpm --filter @circi/cypress exec cypress install
      - save_cache:
          key: cypress-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/Cypress

jobs:
  # Required status check. Everything in `pnpm gate`, without Docker. The image has no Rust toolchain, so
  # the build skips the native diff engine and the JS engine (the default) is what the tests use.
  gate:
    executor:
      name: node
      variant: -browsers
    environment:
      # Each package's tests are their own Vitest process, about 20 of them: four at a time keeps the
      # job inside its 8 GiB (three peaked at 5.3 GiB; Turborepo's default of 10 at once is for a bigger machine).
      TURBO_CONCURRENCY: '4'
    steps:
      - checkout
      - setup
      - install-chromium:
          with-deps: false # the image has them
      - install-cypress
      - restore-turbo
      # `pnpm gate` in its two halves, one after the other: tsgolint (`oxlint --type-aware`) and the
      # `tsc` runs started beside the Node and browser tests took the job to 7.2 of its 8 GiB, and the
      # kernel killed tsgolint (SIGKILL).
      - run:
          name: pnpm gate:checks
          command: pnpm gate:checks
          no_output_timeout: 20m
      - run:
          name: pnpm gate:tests
          command: pnpm gate:tests
          no_output_timeout: 20m
      - save-turbo

  # A change to a published package (@circi/cli, @circi/vitest) needs a changeset (`pnpm changeset`).
  # Not run on main or on the release workflow's "Version Packages" branch, which consumes the changesets.
  changeset:
    executor: node
    steps:
      - checkout
      - run:
          name: Fetch main for the comparison
          command: git fetch origin main:refs/remotes/origin/main
      - setup
      - run:
          name: Changeset status
          command: pnpm exec changeset status --since=origin/main

  # The end-to-end groups of `pnpm gate:full` (@circi/e2e's e2e:api and e2e:browser): the real server, worker and
  # CLI image on Docker, with Chromium for the dashboard. The gate's own tasks run in the `gate` job.
  e2e:
    executor: docker-vm
    environment:
      # 2 Vitest workers per group (the default of the e2e scripts); both groups run at once on the `large` machine (4 vCPU, 15 GB; xlarge needs a paid plan), with the e2e timeouts sized for it.
      E2E_WORKERS: '2'
    steps:
      - checkout
      - setup
      - install-chromium
      - restore-turbo
      - run:
          name: Build (the end-to-end tests use the CLI's dist)
          command: pnpm build
      - run:
          name: End-to-end tests
          command: |
            E2E_ENV_FINGERPRINT="$(pnpm --silent e2e:fingerprint)" \
              pnpm exec turbo run e2e:api e2e:browser --filter=@circi/e2e
          no_output_timeout: 30m
      - save-turbo
      - store_artifacts:
          path: e2e/.artifacts
          destination: e2e-artifacts

  # The shipped Compose files (deploy/docker-compose.yml + the S3 overlay) brought up for real. The checks
  # are a typed test, e2e/test/deploy/compose.deploy.test.ts (`pnpm test:compose`): healthy stack, the admin
  # commands inside the image, sign-in, and the storage driver's live tests against the overlay's S3 server.
  # It picks its own compose project name and free ports, prints the logs when a test fails and always
  # runs `down -v`. Orbs considered and left out: circleci/docker (login and Hadolint, nothing used here:
  # the images are public) and circleci/node's test helpers (the junit file below is one flag).
  compose-smoke:
    executor: docker-vm
    steps:
      - checkout
      - setup
      - run:
          name: Compose smoke test
          command: pnpm test:compose --reporter=default --reporter=junit --outputFile.junit=test-results/compose/junit.xml # in e2e/, where its tests run
      - store_test_results:
          path: e2e/test-results

  terraform:
    executor:
      name: terraform/default
      tag: '1.15'
    steps:
      - checkout
      - terraform/fmt:
          path: deploy/terraform
          recursive: true
      - terraform/init:
          path: deploy/terraform
          backend: false
      # The orb has no command for `terraform test`.
      - run:
          name: terraform test
          command: terraform -chdir=deploy/terraform test

  helm:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install helm and kubeconform
          command: |
            curl -fsSL https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
            curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
      - run:
          name: helm lint, template and kubeconform
          command: deploy/helm/test.sh

  # Renovate, run on its own schedule (see the top of this file). Its image has Node, which mints
  # the app's token (scripts/github-app-token.mjs); the token lives an hour and stays in this job.
  renovate:
    docker:
      - image: renovate/renovate:44.222.5
    resource_class: medium
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: '["cir-ci/repo"]'
      # The one command the post-upgrade task may run.
      RENOVATE_ALLOWED_COMMANDS: '["^node scripts/renovate-changeset\\.mjs$"]'
      # The repository has its config already; commits go through GitHub's API, as the app.
      RENOVATE_ONBOARDING: 'false'
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_PLATFORM_COMMIT: enabled
    steps:
      - checkout
      - run:
          name: Renovate
          command: |
            RENOVATE_TOKEN=$(node scripts/github-app-token.mjs cir-ci/repo)
            export RENOVATE_TOKEN
            renovate

workflows:
  gate:
    unless:
      or:
        - << pipeline.parameters.nightly >>
        - << pipeline.parameters.renovate >>
    jobs:
      # The Flakiness context holds FLAKINESS_ACCESS_TOKEN, with which the test runs upload their
      # reports to Flakiness.io (packages/vitest-config/shared.ts).
      - gate:
          context: Flakiness
      - terraform
      - helm
      - changeset:
          filters:
            branches:
              ignore:
                - main
                # The release PR's branch, and the temporary branch changesets/action pushes its commit to
                # first (changesets-ghcommit-temp/changeset-release/main) before moving the PR's branch there.
                - /^(changesets-ghcommit-temp\/)?changeset-release\/main$/

  e2e:
    when:
      and:
        - not: << pipeline.parameters.renovate >>
        - or:
            - << pipeline.parameters.nightly >>
            - equal: [main, << pipeline.git.branch >>]
    jobs:
      - e2e:
          context: Flakiness
      - compose-smoke:
          context: Flakiness

  renovate:
    when: << pipeline.parameters.renovate >>
    jobs:
      # The renovate context holds CIRCI_APP_CLIENT_ID and CIRCI_APP_PRIVATE_KEY (the `cir-ci` app's).
      - renovate:
          context: renovate
