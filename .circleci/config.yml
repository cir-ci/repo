# CirCI's CI. Two workflows:
#
#   gate  every push and pull request: `pnpm gate` (format check, lint, typecheck, the Node, UI and web
#         browser tests, build). No Docker. Required status check: `gate`.
#         The `changeset` job (branches other than main) fails when a published package changed without a
#         changeset.
#   e2e   pushes to main and the nightly pipeline: the end-to-end tests against the real Docker stack
#         (`e2e`) and the shipped Compose files (`compose-smoke`). Machine executor, so Docker works.
#
# The nightly run is a scheduled pipeline that sets the `nightly` parameter to true. Scheduled pipelines
# are created in the CircleCI UI (Project Settings > Triggers > Add Trigger), not in this file: pick the
# branch (main), a time, and add the pipeline parameter `nightly` = true. See CONTRIBUTING.md.
version: 2.1

orbs:
  node: circleci/node@7.2.1

parameters:
  nightly:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:26.13 # Node 26, the same major as .nvmrc
    resource_class: large # 4 vCPU, 8 GB: the two browser test projects each take a quarter of the cores
    working_directory: ~/circi
    environment:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
  docker-vm:
    machine:
      image: ubuntu-2404:current
    resource_class: large # 4 vCPU, 15 GB: the end-to-end stack needs the Docker VM's memory
    working_directory: ~/circi
    environment:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
  # The end-to-end job alone: both groups at once, each with 2 Vitest workers, a Docker stack per
  # worker and Chromium. On `large` (4 vCPU) a stack took 17 to 61 s to boot (7 s on a laptop) and the
  # browser group needed 760 s with failures that were only waits running out; the work is CPU-bound,
  # so twice the cores is about half the time at the same total cost, and the stacks, the tests and
  # the dashboard stop competing for the same four cores.
  docker-vm-xlarge:
    machine:
      image: ubuntu-2404:current
    resource_class: xlarge # 8 vCPU, 32 GB
    working_directory: ~/circi
    environment:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'

commands:
  # Node from .nvmrc and pnpm 12.16.1 (package.json's "packageManager") through the CircleCI node orb,
  # then `pnpm install --frozen-lockfile` with the orb's node_modules cache.
  setup:
    steps:
      - node/install:
          install-pnpm: true
          pnpm-version: '12.16.1'
      - node/install-packages:
          pkg-manager: pnpm

  # Turborepo's cache (.turbo/cache) makes an unchanged task instant. The key is per revision, so every
  # run saves; the restore falls back to the branch's latest, then to any run.
  restore-turbo:
    steps:
      - restore_cache:
          keys:
            - turbo-v1-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - turbo-v1-{{ arch }}-{{ .Branch }}-
            - turbo-v1-{{ arch }}-

  save-turbo:
    steps:
      - save_cache:
          key: turbo-v1-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .turbo
          when: always

  install-chromium:
    parameters:
      with-deps:
        type: boolean
        default: true
    steps:
      - restore_cache:
          keys:
            - playwright-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Chromium for Playwright
          command: |
            if [ "<< parameters.with-deps >>" = "true" ]; then
              pnpm exec playwright install --with-deps chromium
            else
              pnpm exec playwright install chromium
            fi
      - save_cache:
          key: playwright-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright

jobs:
  # Required status check. Everything in `pnpm gate`, without Docker. The image has no Rust toolchain, so
  # the build skips the native diff engine and the JS engine (the default) is what the tests use.
  gate:
    executor: node
    steps:
      - checkout
      - setup
      - install-chromium
      - restore-turbo
      - run:
          name: pnpm gate
          command: pnpm gate
          no_output_timeout: 20m
      - save-turbo

  # A change to a published package (@circi/cli, @circi/vitest) needs a changeset (`pnpm changeset`).
  # Not run on main or on the release workflow's "Version Packages" branch, which consumes the changesets.
  changeset:
    executor: node
    steps:
      - checkout
      - run:
          name: Fetch main for the comparison
          command: git fetch origin main:refs/remotes/origin/main
      - setup
      - run:
          name: Changeset status
          command: pnpm exec changeset status --since=origin/main

  # The end-to-end groups of `pnpm gate:full` (//#e2e:api and //#e2e:browser): the real server, worker and
  # CLI image on Docker, with Chromium for the dashboard. The gate's own tasks run in the `gate` job.
  e2e:
    executor: docker-vm-xlarge
    environment:
      # 2 Vitest workers per group (the default of the e2e scripts); both groups run at once on 8 vCPU / 32 GB.
      E2E_WORKERS: '2'
    steps:
      - checkout
      - setup
      - install-chromium
      - restore-turbo
      - run:
          name: Build (the end-to-end tests use the CLI's dist)
          command: pnpm build
      - run:
          name: End-to-end tests
          command: |
            E2E_ENV_FINGERPRINT="$(pnpm --silent e2e:fingerprint)" \
              pnpm exec turbo run //#e2e:api //#e2e:browser
          no_output_timeout: 30m
      - save-turbo
      - store_artifacts:
          path: e2e/.artifacts
          destination: e2e-artifacts

  # The shipped Compose files (deploy/docker-compose.yml + the S3 overlay) brought up for real. The checks
  # are a typed test, e2e/test/deploy/compose.deploy.test.ts (`pnpm test:compose`): healthy stack, the admin
  # commands inside the image, sign-in, and the storage driver's live tests against the overlay's S3 server.
  # It picks its own compose project name and free ports, prints the logs when a test fails and always
  # runs `down -v`. Orbs considered and left out: circleci/docker (login and Hadolint, nothing used here:
  # the images are public) and circleci/node's test helpers (the junit file below is one flag).
  compose-smoke:
    executor: docker-vm
    steps:
      - checkout
      - setup
      - run:
          name: Compose smoke test
          command: pnpm test:compose --reporter=default --reporter=junit --outputFile.junit=test-results/compose/junit.xml
      - store_test_results:
          path: test-results

workflows:
  gate:
    unless: << pipeline.parameters.nightly >>
    jobs:
      - gate
      - changeset:
          filters:
            branches:
              ignore:
                - main
                - changeset-release/main

  e2e:
    when:
      or:
        - << pipeline.parameters.nightly >>
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - e2e
      - compose-smoke
